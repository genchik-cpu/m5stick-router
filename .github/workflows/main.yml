name: Compile ESP32 NAT Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install ESP32 Platform & Local ZIP Libraries
      run: |
        arduino-cli config init
        arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        
        # Скачиваем M5GFX напрямую из официального репозитория, обходя лимиты
        echo "=== Скачивание и установка M5GFX ==="
        wget -q -O ./M5GFX-master.zip https://github.com/m5stack/M5GFX/archive/refs/heads/master.zip
        arduino-cli lib install --zip-path ./M5GFX-master.zip
        
        # Установка остальных твоих ZIP-архивов, которые ты уже загрузил
        echo "=== Установка локальных библиотек ==="
        arduino-cli lib install --zip-path ./M5Unified-develop.zip
        arduino-cli lib install --zip-path ./M5StickCPlus2-1.0.1.zip
        arduino-cli lib install --zip-path ./WireGuard-ESP32-Arduino-main.zip

    - name: Patch liblwip.a for NAT Support
      run: |
        LWIP_DIR=$(find ~/.arduino15/packages/esp32/hardware/esp32/ -type d -name "esp32" | grep "tools/sdk")
        if [ -n "$LWIP_DIR" ]; then
          cd "$LWIP_DIR/lib"
          mv liblwip.a liblwip.a.bak
          wget -q -O liblwip.a "https://raw.githubusercontent.com/dchristl/esp32_nat_router_extended/main/components/lwip/lib/esp32/liblwip.a"
          echo "Патч lwIP успешно применен!"
        else
          echo "Ошибка: ядро ESP32 не найдено!"
          exit 1
        fi

    - name: Compile Firmware
      run: |
        mkdir -p build
        # Компиляция под M5StickC Plus 2
        arduino-cli compile --fqbn esp32:esp32:m5stick_c_plus2 ./ --output-dir ./build

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: M5Router-Firmware
        path: ./build/*.bin
        
